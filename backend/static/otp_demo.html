<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kapiert – Verify your email</title>
  <meta name="description" content="Email one-time-code verification demo for the Kapiert OTP service.">
  <style>
    :root {
      --bg: #0b1417; --card: #121e22; --field: #1a2a2f; --line: #2a3d43;
      --text: #eef5f6; --muted: #8fa5ab; --blue: #3b82f6; --red: #ef4444; --green: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #12303a 0%, var(--bg) 60%);
      color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    input[type=email] {
      width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--field); color: var(--text); font-size: 16px;
    }
    input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.25); }
    button.primary {
      width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--blue); color: #fff; font-size: 16px; font-weight: 700;
    }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
    button.link { background: none; border: 0; color: var(--blue); font-weight: 700; cursor: pointer; font-size: 14px; padding: 8px; }
    button.link:disabled { color: var(--muted); cursor: not-allowed; }
    .otp { display: flex; gap: 10px; justify-content: space-between; margin: 8px 0 4px; }
    .otp input {
      width: 100%; min-width: 0; aspect-ratio: 1 / 1.2; text-align: center; font-size: 26px; font-weight: 700;
      border-radius: 12px; border: 1.5px solid var(--line); background: var(--field); color: var(--text);
    }
    .otp.error input { border-color: var(--red); }
    .otp.shake { animation: shake .35s; }
    .otp.success input { border-color: var(--green); }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .otp.shake { animation: none; } }
    .msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; }
    .msg.error { color: var(--red); } .msg.ok { color: var(--green); }
    .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 13px; }
    .hidden { display: none; }
    .done { text-align: center; }
    .done .tick { font-size: 56px; color: var(--green); }
  </style>
</head>
<body>
  <main class="card">
    <!-- Step 1: email -->
    <form id="email-form" novalidate>
      <h1>Verify your email</h1>
      <p class="sub">We'll send a 6-digit code to confirm it's really you.</p>
      <label for="email">EMAIL</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <p id="email-msg" class="msg" role="alert" aria-live="polite"></p>
      <button id="send-btn" class="primary" type="submit">Send code</button>
    </form>

    <!-- Step 2: code -->
    <form id="code-form" class="hidden" novalidate>
      <h1>Check your email</h1>
      <p class="sub">Enter the 6-digit code sent to <strong id="sent-to"></strong>.</p>
      <div id="otp" class="otp" role="group" aria-label="6-digit verification code">
        <!-- inputs are created by script so the count lives in one place -->
      </div>
      <p id="code-msg" class="msg" role="alert" aria-live="polite"></p>
      <button id="verify-btn" class="primary" type="submit" disabled>Verify</button>
      <div class="meta">
        <span id="expiry"></span>
        <span>Didn't get it? <button id="resend-btn" class="link" type="button" disabled>Resend code</button></span>
      </div>
      <button id="change-email" class="link" type="button">Use a different email</button>
    </form>

    <!-- Step 3: done -->
    <section id="done" class="done hidden" aria-live="polite">
      <div class="tick" aria-hidden="true">&#10003;</div>
      <h1>Email verified</h1>
      <p class="sub" id="done-text"></p>
    </section>
  </main>

  <script>
    const LENGTH = 6;
    const $ = (id) => document.getElementById(id);
    const state = { email: '', expiresAt: 0, resendAt: 0, busy: false, locked: false };
    let ticker = null;

    // ---- build the digit boxes -------------------------------------------------
    const otpBox = $('otp');
    const digits = Array.from({ length: LENGTH }, (_, i) => {
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'numeric';           // numeric keypad on mobile
      input.pattern = '[0-9]*';
      input.maxLength = 1;
      input.autocomplete = i === 0 ? 'one-time-code' : 'off';  // SMS/email code autofill
      input.setAttribute('aria-label', `Digit ${i + 1}`);
      otpBox.appendChild(input);
      return input;
    });

    const code = () => digits.map((d) => d.value).join('');
    const setMsg = (el, text, kind) => { el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); };

    function fill(startIndex, text) {
      const only = text.replace(/[^0-9]/g, '');           // also strips non-ASCII digits
      if (!only) return;
      for (let k = 0; k < only.length && startIndex + k < LENGTH; k++) digits[startIndex + k].value = only[k];
      digits[Math.min(startIndex + only.length, LENGTH - 1)].focus();
      refresh();
    }

    digits.forEach((input, i) => {
      input.addEventListener('input', () => {
        const v = input.value.replace(/[^0-9]/g, '');
        input.value = '';
        if (v) fill(i, v);                                  // handles typing and autofill of the full code
        else refresh();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) { digits[i - 1].value = ''; digits[i - 1].focus(); e.preventDefault(); refresh(); }
        else if (e.key === 'ArrowLeft' && i > 0) { digits[i - 1].focus(); e.preventDefault(); }
        else if (e.key === 'ArrowRight' && i < LENGTH - 1) { digits[i + 1].focus(); e.preventDefault(); }
      });
      input.addEventListener('paste', (e) => { e.preventDefault(); fill(0, (e.clipboardData || window.clipboardData).getData('text')); });
      input.addEventListener('focus', () => input.select());
    });

    function refresh() {
      otpBox.classList.remove('error', 'shake');
      const complete = code().length === LENGTH;
      $('verify-btn').disabled = !complete || state.busy || state.locked;
      if (complete && !state.busy && !state.locked) submitCode();   // auto-submit
    }

    function lockInputs(locked) { state.locked = locked; digits.forEach((d) => { d.disabled = locked; }); $('verify-btn').disabled = true; }
    function clearInputs() { digits.forEach((d) => { d.value = ''; }); }

    // ---- API -------------------------------------------------------------------
    async function post(path, body) {
      let res;
      try {
        res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      } catch {
        return { ok: false, detail: { code: 'network', message: 'Network error. Check your connection and try again.' } };
      }
      let data = null;
      try { data = await res.json(); } catch { /* non-JSON error body */ }
      if (res.ok) return { ok: true, data };
      let detail = data && data.detail;
      if (Array.isArray(detail)) {                                  // FastAPI validation error (422)
        detail = { code: 'validation', message: (detail[0] && detail[0].msg || 'Invalid input.').replace(/^Value error, /, '') };
      }
      return { ok: false, detail: detail || { code: 'unknown', message: 'Something went wrong. Please try again.' } };
    }

    // ---- timers ----------------------------------------------------------------
    const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    function tick() {
      const now = Date.now();
      const left = Math.max(0, Math.ceil((state.expiresAt - now) / 1000));
      const wait = Math.max(0, Math.ceil((state.resendAt - now) / 1000));
      $('expiry').textContent = left > 0 ? `Expires in ${fmt(left)}` : 'Code expired';
      $('resend-btn').disabled = wait > 0 || state.busy;
      $('resend-btn').textContent = wait > 0 ? `Resend code (${wait}s)` : 'Resend code';
      if (left === 0 && !state.locked && !$('code-form').classList.contains('hidden')) {
        lockInputs(true);
        setMsg($('code-msg'), 'This code has expired. Request a new one.', 'error');
      }
    }
    function startTimers(expiresIn, resendAfter) {
      state.expiresAt = Date.now() + expiresIn * 1000;
      state.resendAt = Date.now() + resendAfter * 1000;
      clearInterval(ticker); ticker = setInterval(tick, 500); tick();
    }

    // ---- flows -----------------------------------------------------------------
    async function sendCode(isResend) {
      const msgEl = isResend ? $('code-msg') : $('email-msg');
      state.busy = true; $('send-btn').disabled = true; $('resend-btn').disabled = true;
      setMsg(msgEl, 'Sending…');
      const r = await post('/api/send-otp', { email: state.email });
      state.busy = false; $('send-btn').disabled = false;
      if (!r.ok) {
        if (r.detail.retry_after_seconds) state.resendAt = Date.now() + r.detail.retry_after_seconds * 1000;
        setMsg(msgEl, r.detail.message, 'error');
        tick();
        return;
      }
      $('email-form').classList.add('hidden'); $('code-form').classList.remove('hidden');
      $('sent-to').textContent = state.email;
      lockInputs(false); clearInputs();
      setMsg($('code-msg'), isResend ? 'A new code was sent.' : '', isResend ? 'ok' : '');
      startTimers(r.data.expires_in_seconds, r.data.resend_after_seconds);
      digits[0].focus();
    }

    async function submitCode() {
      if (state.busy || state.locked || code().length !== LENGTH) return;
      state.busy = true; $('verify-btn').disabled = true;
      setMsg($('code-msg'), 'Verifying…');
      const r = await post('/api/verify-otp', { email: state.email, code: code() });
      state.busy = false;
      if (r.ok) {
        clearInterval(ticker);
        $('code-form').classList.add('hidden'); $('done').classList.remove('hidden');
        $('done-text').textContent = `${r.data.email} is now verified.`;
        return;
      }
      const d = r.detail;
      if (d.code === 'invalid_code') {
        const n = d.attempts_remaining;
        setMsg($('code-msg'), `Incorrect code. ${n} attempt${n === 1 ? '' : 's'} left.`, 'error');
        clearInputs(); otpBox.classList.add('error', 'shake'); digits[0].focus();
      } else if (d.code === 'expired_code' || d.code === 'no_active_code' || d.code === 'too_many_attempts') {
        setMsg($('code-msg'), d.message, 'error');
        clearInputs(); lockInputs(true); otpBox.classList.add('error');   // user must request a new code
      } else {
        setMsg($('code-msg'), d.message, 'error');                         // network / unexpected
        $('verify-btn').disabled = code().length !== LENGTH;
      }
      tick();
    }

    $('email-form').addEventListener('submit', (e) => {
      e.preventDefault();
      state.email = $('email').value.trim().toLowerCase();
      if (!state.email) { setMsg($('email-msg'), 'Enter your email address.', 'error'); return; }
      sendCode(false);
    });
    $('code-form').addEventListener('submit', (e) => { e.preventDefault(); submitCode(); });
    $('resend-btn').addEventListener('click', () => sendCode(true));
    $('change-email').addEventListener('click', () => {
      clearInterval(ticker); lockInputs(false); clearInputs();
      $('code-form').classList.add('hidden'); $('email-form').classList.remove('hidden');
      setMsg($('email-msg'), ''); $('email').focus();
    });
  </script>
</body>
</html>
