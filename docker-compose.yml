services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kapiert-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=true
      - ALLOWED_ORIGINS=*
      - NOUNS_CSV_PATH=/app/nouns.csv
    volumes:
      - ./backend:/app
      - /app/__pycache__
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
